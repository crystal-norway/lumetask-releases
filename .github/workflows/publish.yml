name: Publish verified Android release
on:
  push:
    paths: [release.json, 'release-notes/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public artifact and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const repo=process.env.GITHUB_REPOSITORY,sha=process.env.GITHUB_SHA;
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          async function api(route,options={}) {
            const response=await fetch('https://api.github.com'+route,{...options,headers:{...headers,...options.headers}});
            if(!response.ok)throw new Error(`GitHub operation failed (${response.status})`);
            if(response.status===204)return null;
            return response.json();
          }
          const content=await api(`/repos/${repo}/contents/release.json?ref=${sha}`);
          const release=JSON.parse(Buffer.from(content.content,'base64').toString('utf8'));
          if(release.schema!==1||!/^\d+\.\d+\.\d+$/.test(release.version)||release.filename!==`LumeTask-${release.version}.apk`||
             release.path!==`/downloads/${release.filename}`||!/^[a-f0-9]{64}$/.test(release.sha256)||
             !Number.isSafeInteger(release.size)||release.size<1||release.size>25*1024*1024)throw new Error('Invalid release manifest');
          const tag=`v${release.version}`,releases=await api(`/repos/${repo}/releases?per_page=100`);
          const title=`LumeTask ${release.version} · 公开内测`;
          const notes=await api(`/repos/${repo}/contents/release-notes/v${release.version}.md?ref=${sha}`);
          const body=Buffer.from(notes.content,'base64').toString('utf8');
          if(!body.trim()||body.includes('\uFFFD')||body.includes('{{'))throw new Error('Invalid release notes');
          let published=releases.find(item=>item.tag_name===tag);
          if(published&&!published.draft) {
            const asset=published.assets.find(item=>item.name===release.filename);
            if(asset?.size!==release.size||asset?.digest!==`sha256:${release.sha256}`)throw new Error('Published version differs; never overwrite it');
          }
          if(!published)published=await api(`/repos/${repo}/releases`,{method:'POST',body:JSON.stringify({tag_name:tag,target_commitish:sha,
            name:title,draft:true,prerelease:true,body})});
          // The signed APK must already be uploaded to this GitHub draft. Pages is only a permanent link.
          const apk=published.assets.find(asset=>asset.name===release.filename);
          if(apk?.state!=='uploaded'||apk.size!==release.size||apk.digest!==`sha256:${release.sha256}`)
            throw new Error('Upload the matching signed APK to the GitHub draft, then rerun this workflow');
          const checksum=Buffer.from(`${release.sha256}  ${release.filename}\n`);
          const metadata=Buffer.from(JSON.stringify(release,null,2)+'\n');
          for(const [name,data,type] of [['SHA256SUMS.txt',checksum,'text/plain'],['release.json',metadata,'application/json']]) {
            const digest=`sha256:${createHash('sha256').update(data).digest('hex')}`;
            const existing=published.assets.find(asset=>asset.name===name);
            if(existing){
              if(existing.size===data.length&&existing.digest===digest)continue;
              // Only descriptive metadata can be refreshed; APK and checksum remain immutable.
              if(name!=='release.json')throw new Error('Release asset differs; inspect it before retrying');
              await api(`/repos/${repo}/releases/assets/${existing.id}`,{method:'DELETE'});
            }
            const upload=await fetch(`https://uploads.github.com/repos/${repo}/releases/${published.id}/assets?name=${encodeURIComponent(name)}`,
              {method:'POST',headers:{...headers,'Content-Type':type},body:data});
            if(!upload.ok)throw new Error(`Asset upload failed (${upload.status})`);
            const asset=await upload.json();
            if(asset.size!==data.length||(asset.digest&&asset.digest!==digest))throw new Error('Uploaded asset verification failed');
          }
          published=await api(`/repos/${repo}/releases/${published.id}`,{method:'PATCH',body:JSON.stringify({name:title,body,draft:false})});
          console.log(published.html_url);
          NODE
